[project]
name = "smart-support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ismail Ashraf", email = "iismmail23@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.3.0",
    "pymupdf>=1.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "langchain-text-splitters>=0.2.0"
]

[project.scripts]
smart-support-agent = "smart_support_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
